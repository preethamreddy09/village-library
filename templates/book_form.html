{% extends "base.html" %}

{% block content %}
<h2>{{ "Edit book" if book else "Add a book" }}</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class="flashes">
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form method="POST" enctype="multipart/form-data" class="book-form"
      action="{{ url_for('catalog.edit_book', book_id=book.id) if book else url_for('catalog.add_book') }}">
    <label>Title
        <input type="text" name="title" required value="{{ book.title if book else '' }}">
    </label>

    <label>Author
        <input type="text" name="author" required value="{{ book.author if book else '' }}">
    </label>

    <label>Genre
        <select name="genre" required>
            <option value="" disabled {{ "" if book else "selected" }}>Select a genre</option>
            {% for g in genres %}
            <option value="{{ g }}" {{ "selected" if book and book.genre == g else "" }}>{{ g }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Language
        <select name="language" required>
            <option value="" disabled {{ "" if book else "selected" }}>Select a language</option>
            {% for l in languages %}
            <option value="{{ l }}" {{ "selected" if book and book.language == l else "" }}>{{ l }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Age group
        <select name="age_group" required>
            <option value="" disabled {{ "" if book else "selected" }}>Select an age group</option>
            {% for a in age_groups %}
            <option value="{{ a }}" {{ "selected" if book and book.age_group == a else "" }}>{{ a }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Summary
        <textarea name="summary" rows="4">{{ book.summary if book else '' }}</textarea>
    </label>

    <label>Total copies
        <input type="number" name="total_copies" min="1" value="{{ book.total_copies if book else 1 }}">
    </label>

    <label>Cover image {{ "(leave blank to keep current)" if book else "(optional)" }}
        <input type="file" name="cover_image" accept="image/*">
    </label>

    <button type="submit">{{ "Save changes" if book else "Save book" }}</button>
</form>

{% if book %}
<form method="POST" action="{{ url_for('catalog.delete_book', book_id=book.id) }}"
      onsubmit="return confirm('Remove this book from the catalog? This can\'t be undone.');"
      style="margin-top: 14px;">
    <button type="submit" style="background: var(--stamp);">Remove this book</button>
</form>
{% endif %}
{% endblock %}
