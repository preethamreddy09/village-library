{% extends "base.html" %}

{% block content %}
<h2>{{ "Edit book" if book else "Add a book" }}</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class="flashes">
    {% for message in messages %}
      <li>{{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form method="POST" enctype="multipart/form-data" class="book-form"
      action="{{ url_for('catalog.edit_book', book_id=book.id) if book else url_for('catalog.add_book') }}">
    <label>Title
        <input type="text" name="title" required value="{{ book.title if book else '' }}">
    </label>

    <label>Author
        <input type="text" name="author" required value="{{ book.author if book else '' }}">
    </label>

    <label>Genre / category
        <input type="text" name="genre" required value="{{ book.genre if book else '' }}">
    </label>

    <label>Summary
        <textarea name="summary" rows="4">{{ book.summary if book else '' }}</textarea>
    </label>

    <label>Total copies
        <input type="number" name="total_copies" min="1" value="{{ book.total_copies if book else 1 }}">
    </label>

    <label>Cover image {{ "(leave blank to keep current)" if book else "(optional)" }}
        <input type="file" name="cover_image" accept="image/*">
    </label>

    <button type="submit">{{ "Save changes" if book else "Save book" }}</button>
</form>

{% if book %}
<form method="POST" action="{{ url_for('catalog.delete_book', book_id=book.id) }}"
      onsubmit="return confirm('Remove this book from the catalog? This can\'t be undone.');"
      style="margin-top: 14px;">
    <button type="submit" style="background: var(--stamp);">Remove this book</button>
</form>
{% endif %}
{% endblock %}
